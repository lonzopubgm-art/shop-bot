<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internet Do'kon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 pb-20">

    <div class="max-w-md mx-auto p-4">
        <h1 class="text-2xl font-bold mb-4 text-center text-indigo-600">🛍 Onlayn Do'kon</h1>

        <div class="grid grid-cols-2 gap-4" id="product-list">
            <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-between">
                <div>
                    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=300" class="w-full h-32 object-cover rounded-lg mb-2">
                    <h3 class="font-semibold text-sm">Wireless Naushnik</h3>
                    <p class="text-indigo-600 font-bold text-sm mt-1">150,000 so'm</p>
                </div>
                <button onclick="addToCart('Wireless Naushnik', 150000)" class="mt-3 bg-indigo-600 text-white text-xs py-2 rounded-lg font-medium active:scale-95 transition">Savatga qo'shish</button>
            </div>
            <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-between">
                <div>
                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300" class="w-full h-32 object-cover rounded-lg mb-2">
                    <h3 class="font-semibold text-sm">Smart Soat</h3>
                    <p class="text-indigo-600 font-bold text-sm mt-1">300,000 so'm</p>
                </div>
                <button onclick="addToCart('Smart Soat', 300000)" class="mt-3 bg-indigo-600 text-white text-xs py-2 rounded-lg font-medium active:scale-95 transition">Savatga qo'shish</button>
            </div>
        </div>
    </div>

    <div id="cart-bar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 max-w-md mx-auto flex justify-between items-center shadow-lg hidden">
        <div>
            <p class="text-xs text-gray-500">Jami summa:</p>
            <p class="text-lg font-bold text-indigo-600" id="total-price">0 so'm</p>
        </div>
        <button onclick="checkout()" class="bg-green-600 text-white px-6 py-2.5 rounded-xl font-semibold shadow-md active:scale-95 transition">Buyurtma berish</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let cart = [];

        function addToCart(name, price) {
            let existing = cart.find(item => item.name === name);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ name: name, price: price, quantity: 1 });
            }
            updateCartUI();
        }

        function updateCartUI() {
            let cartBar = document.getElementById('cart-bar');
            let totalPriceEl = document.getElementById('total-price');
            let total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            
            if (cart.length > 0) {
                cartBar.classList.remove('hidden');
                totalPriceEl.innerText = total.toLocaleString() + " so'm";
            } else {
                cartBar.classList.add('hidden');
            }
        }

        function checkout() {
            let total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            fetch('/api/order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cart: cart, total: total })
            })
            .then(res => res.json())
            .then(data => {
                alert("Buyurtmangiz muvaffaqiyatli yuborildi!");
                cart = [];
                updateCartUI();
                tg.close();
            });
        }
    </script>
</body>
</html>
