<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stilmen | Mens Wear</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0c0c0e;--card:#17171a;--card2:#202024;--line:#2b2b31;--gold:#d4af37;--gold2:#f0d77a;--text:#f4f4f5;--mute:#9a9aa3;--red:#ff5d5d}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:110px;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button{font-family:inherit}

header{padding:20px 16px 6px;text-align:center}
.brand{font-size:28px;font-weight:800;letter-spacing:6px;background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:11px;letter-spacing:5px;color:var(--mute);margin-top:3px}

.hero{margin:12px 16px 0;padding:16px 18px;border-radius:18px;background:linear-gradient(135deg,#26210f,#17171a 70%);border:1px solid #3a3217;display:flex;justify-content:space-between;align-items:center}
.hero b{display:block;font-size:16px;color:var(--gold2)}
.hero span{font-size:12.5px;color:var(--mute)}
.hero i{font-style:normal;font-size:34px}

.top{position:sticky;top:0;z-index:5;background:rgba(12,12,14,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:10px 0 6px;margin-top:6px}
.search{margin:0 16px}
input,textarea{width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:13px 15px;font-size:16px;outline:none;font-family:inherit;transition:border-color .2s}
input:focus,textarea:focus{border-color:var(--gold)}
::placeholder{color:#6d6d76}
.cats{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 17px;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:14px;cursor:pointer;transition:all .15s}
.chip.on{background:linear-gradient(135deg,var(--gold),var(--gold2));border-color:var(--gold);color:#111;font-weight:700}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;transition:transform .15s;animation:fade .35s both}
.card:active{transform:scale(.96)}
.pic{aspect-ratio:4/5;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:56px;overflow:hidden;position:relative}
.badge{position:absolute;top:8px;left:8px;background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:4px 9px;border-radius:12px;letter-spacing:.3px}
.chip.off{opacity:.35;text-decoration:line-through;pointer-events:none}
.lowtxt{color:var(--red);font-size:13px;margin-top:10px}
.pic img{width:100%;height:100%;object-fit:cover}
.info{padding:11px 12px 14px}
.name{font-size:14px;line-height:1.3;min-height:36px}
.price{color:var(--gold);font-weight:700;margin-top:6px;font-size:15px}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:50px 0;line-height:1.8}
.empty button{margin-top:10px;width:auto;padding:11px 22px}

.skel{height:250px;border-radius:18px;background:linear-gradient(100deg,var(--card) 30%,var(--card2) 50%,var(--card) 70%);background-size:300% 100%;animation:sh 1.3s infinite}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}

.btn{width:100%;border:0;border-radius:15px;padding:15px;font-size:16px;font-weight:700;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#111;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;z-index:20}
.overlay.show{display:flex}
.sheet{background:var(--bg);width:100%;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));border-top:1px solid var(--line);animation:up .28s ease-out}
.sheet h3{font-size:19px;margin-bottom:10px}
.close{float:right;background:var(--card2);border:0;color:var(--text);width:34px;height:34px;border-radius:50%;font-size:15px;cursor:pointer}
.big{aspect-ratio:1.15;border-radius:16px;overflow:hidden;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:90px;margin:8px 0 14px}
.big img{width:100%;height:100%;object-fit:cover}
.label{font-size:13px;color:var(--mute);margin:16px 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}

.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.thumb{width:54px;height:54px;border-radius:12px;background:var(--card2);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.row .t{flex:1;font-size:14px;min-width:0}
.row .t small{display:block;color:var(--mute);margin-top:3px;font-size:12.5px}
.qty{display:flex;align-items:center;gap:9px}
.qty button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:18px;cursor:pointer}
.del{background:none!important;border:0!important;color:var(--red)!important;font-size:16px!important;width:26px!important}
.total{display:flex;justify-content:space-between;font-size:18px;font-weight:700;margin:18px 0 12px}
.total span:last-child{color:var(--gold)}
.form{display:grid;gap:10px;margin-bottom:14px}

.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:10;display:none}
.bar.show{display:block;animation:fade .25s}
.bar .btn{display:flex;justify-content:space-between;box-shadow:0 8px 28px rgba(0,0,0,.6)}

.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--gold);color:#111;padding:10px 18px;border-radius:22px;font-weight:600;font-size:14px;z-index:50;display:none;max-width:92vw;text-align:center}
</style>
</head>
<body>

<header>
  <div class="brand">STILMEN</div>
  <div class="sub">MENS WEAR</div>
</header>

<div class="hero">
  <div><b>Yangi kolleksiya</b><span>Sifatli kiyimlar, qulay narxlarda</span></div>
  <i>🧥</i>
</div>

<div class="top">
  <div class="search"><input id="q" placeholder="🔍 Qidirish..."></div>
  <div class="cats" id="cats"></div>
</div>

<div class="grid" id="grid"></div>

<div class="bar" id="bar">
  <button class="btn" onclick="openCart()"><span id="barCount"></span><span id="barTotal"></span></button>
</div>

<div class="overlay" id="pOv" onclick="if(event.target===this)closeAll()"><div class="sheet" id="pSheet"></div></div>
<div class="overlay" id="cOv" onclick="if(event.target===this)closeAll()"><div class="sheet" id="cSheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor('#0c0c0e'); tg.setBackgroundColor('#0c0c0e'); } catch(e){}
  try { tg.BackButton.onClick(() => closeAll()); } catch(e){}
}

let PRODUCTS = [], CATS = ["Hammasi"];
let cat = "Hammasi", cart = [], cur = null, selSize = "", selColor = "";
const CART_KEY = "stilmen_cart_v2";
const $ = id => document.getElementById(id);
const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " so'm";

function hap(){ try { tg.HapticFeedback.impactOccurred("light"); } catch(e){} }

/* ---------- Xavfsizlik: HTML'ni tozalash ---------- */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function safeUrl(u){
  u = String(u || "").trim();
  return /^(https?:\/\/|\/)/i.test(u) && !/^\/\//.test(u) ? u : "";
}
function pic(p){
  const url = safeUrl(p.img);
  if (url) return `<img src="${esc(url)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('👕'))">`;
  return esc(p.emoji || "👕");
}

/* ---------- Tovarni tekshirish ---------- */
function cleanProduct(p){
  if (!p || typeof p !== "object") return null;
  const id = Number(p.id), price = Number(p.price);
  if (!Number.isFinite(id) || !Number.isFinite(price) || price < 0) return null;
  const arr = a => Array.isArray(a) ? a.map(String).filter(Boolean) : [];
  return {
    id, price,
    name: String(p.name || "Nomsiz tovar"),
    cat: String(p.cat || "Boshqa"),
    img: p.img || "", emoji: p.emoji || "",
    sizes: arr(p.sizes).length ? arr(p.sizes) : ["Standart"],
    colors: arr(p.colors).length ? arr(p.colors) : ["Standart"],
    out: arr(p.out),
    low: (p.low && typeof p.low === "object") ? p.low : {},
    soldout: !!p.soldout
  };
}

/* ---------- Qoldiq (tugagan razmer/rang) ---------- */
const vk = (s, c) => s + "|" + c;
function isOut(p, s, c){ return p.out.includes(vk(s, c)); }
function firstAvail(p){
  for (const s of p.sizes) for (const c of p.colors) if (!isOut(p, s, c)) return [s, c];
  return null;
}

/* ---------- Savat xotirasi ---------- */
function saveCart(){
  try { localStorage.setItem(CART_KEY, JSON.stringify(cart.map(i => ({pid:i.pid, size:i.size, color:i.color, qty:i.qty})))); } catch(e){}
}
function loadCart(){
  try {
    const raw = JSON.parse(localStorage.getItem(CART_KEY) || "[]");
    if (!Array.isArray(raw)) return;
    cart = raw.map(i => {
      const p = PRODUCTS.find(x => x.id === Number(i.pid));
      if (!p || !p.sizes.includes(i.size) || !p.colors.includes(i.color) || isOut(p, i.size, i.color)) return null;
      const qty = Math.min(99, Math.max(1, parseInt(i.qty) || 1));
      return {key: p.id+"|"+i.size+"|"+i.color, pid:p.id, name:p.name, price:p.price, size:i.size, color:i.color, qty};
    }).filter(Boolean);
  } catch(e){ cart = []; }
}

/* ---------- Boshlash ---------- */
function skeleton(){
  $("grid").innerHTML = '<div class="skel"></div>'.repeat(4);
}
async function init(){
  skeleton();
  let failed = false;
  try{
    const r = await fetch("/api/products", {cache:"no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    if (!Array.isArray(data)) throw new Error("bad data");
    PRODUCTS = data.map(cleanProduct).filter(Boolean);
  }catch(e){
    PRODUCTS = []; failed = true;
  }
  CATS = ["Hammasi", ...new Set(PRODUCTS.map(p => p.cat))];
  if (!CATS.includes(cat)) cat = "Hammasi";
  loadCart();
  renderCats(); renderGrid(failed); updateBar();
}

function renderCats(){
  $("cats").innerHTML = CATS.map((c,i) =>
    `<button class="chip ${c===cat?"on":""}" onclick="setCat(${i})">${esc(c)}</button>`).join("");
}
function setCat(i){ cat = CATS[i]; hap(); renderCats(); renderGrid(); }

function renderGrid(failed){
  if (failed){
    $("grid").innerHTML = '<div class="empty">Tovarlarni yuklab bo\'lmadi 😕<br><button class="btn" onclick="init()">Qayta urinish</button></div>';
    return;
  }
  const s = $("q").value.trim().toLowerCase();
  const list = PRODUCTS.filter(p => (cat==="Hammasi" || p.cat===cat) && p.name.toLowerCase().includes(s));
  $("grid").innerHTML = list.length ? list.map((p,k) =>
    `<div class="card" style="animation-delay:${Math.min(k,8)*40}ms" onclick="openProduct(${p.id})">
       <div class="pic">${pic(p)}${p.soldout ? '<div class="badge">Tugagan</div>' : ''}</div>
       <div class="info"><div class="name">${esc(p.name)}</div><div class="price">${fmt(p.price)}</div></div>
     </div>`).join("") : '<div class="empty">Tovar topilmadi</div>';
}

function showSheet(id){
  $(id).classList.add("show");
  document.body.classList.add("lock");
  try { tg && tg.BackButton.show(); } catch(e){}
}

/* ---------- Tovar oynasi ---------- */
function openProduct(id){
  cur = PRODUCTS.find(p => p.id===id);
  if (!cur) return;
  const a = firstAvail(cur);
  if (a){ selSize = a[0]; selColor = a[1]; } else { selSize = cur.sizes[0]; selColor = cur.colors[0]; }
  hap(); renderProduct(); showSheet("pOv");
}
function renderProduct(){
  const p = cur;
  $("pSheet").innerHTML =
    `<button class="close" onclick="closeAll()">✕</button>
     <h3>${esc(p.name)}</h3>
     <div class="big">${pic(p)}</div>
     <div class="price" style="font-size:22px">${fmt(p.price)}</div>
     <div class="label">Razmer</div>
     <div class="opts">${p.sizes.map((s,i)=>`<button class="chip ${s===selSize?"on":""} ${p.colors.every(c=>isOut(p,s,c))?"off":""}" onclick="pick('size',${i})">${esc(s)}</button>`).join("")}</div>
     <div class="label">Rang</div>
     <div class="opts">${p.colors.map((c,i)=>`<button class="chip ${c===selColor?"on":""} ${isOut(p,selSize,c)?"off":""}" onclick="pick('color',${i})">${esc(c)}</button>`).join("")}</div>
     ${p.low[vk(selSize,selColor)] ? `<div class="lowtxt">Oxirgi ${esc(p.low[vk(selSize,selColor)])} ta qoldi</div>` : ""}
     <div style="height:20px"></div>
     ${isOut(p,selSize,selColor) ? `<button class="btn" disabled>Tugagan</button>` : `<button class="btn" onclick="addToCart()">Savatga qo'shish</button>`}`;
}
function pick(t,i){
  if (t==="size"){
    selSize = cur.sizes[i];
    if (isOut(cur, selSize, selColor)){
      const c = cur.colors.find(x => !isOut(cur, selSize, x));
      if (c) selColor = c;
    }
  } else selColor = cur.colors[i];
  hap(); renderProduct();
}

/* ---------- Savat ---------- */
function addToCart(){
  if (isOut(cur, selSize, selColor)){ toast("Bu razmer/rang tugagan"); return; }
  const key = cur.id + "|" + selSize + "|" + selColor;
  const ex = cart.find(i => i.key===key);
  if (ex) ex.qty = Math.min(99, ex.qty + 1);
  else cart.push({key, pid:cur.id, name:cur.name, price:cur.price, size:selSize, color:selColor, qty:1});
  hap(); closeAll(); updateBar(); toast("Savatga qo'shildi ✅");
}

function totalSum(){ return cart.reduce((s,i) => s + i.price*i.qty, 0); }
function updateBar(){
  const n = cart.reduce((s,i) => s + i.qty, 0);
  $("bar").classList.toggle("show", n>0);
  $("barCount").textContent = "🛒 Savat (" + n + ")";
  $("barTotal").textContent = fmt(totalSum());
  saveCart();
}

function openCart(){ hap(); renderCart(); showSheet("cOv"); }
function renderCart(){
  $("cSheet").innerHTML =
    `<button class="close" onclick="closeAll()">✕</button><h3>🛒 Savat</h3>` +
    cart.map((i,x) => {
      const p = PRODUCTS.find(z => z.id === i.pid) || {};
      return `<div class="row">
         <div class="thumb">${pic(p)}</div>
         <div class="t">${esc(i.name)}<small>${esc(i.size)} · ${esc(i.color)}</small><small style="color:var(--gold)">${fmt(i.price*i.qty)}</small></div>
         <div class="qty"><button onclick="chg(${x},-1)">−</button><b>${i.qty}</b><button onclick="chg(${x},1)">+</button><button class="del" onclick="rm(${x})">🗑</button></div>
       </div>`;
    }).join("") +
    `<div class="total"><span>Jami:</span><span>${fmt(totalSum())}</span></div>
     <div class="form">
       <input id="fName" placeholder="Ismingiz" autocomplete="name" maxlength="60">
       <input id="fPhone" type="tel" inputmode="numeric" value="+998 " autocomplete="tel" maxlength="17" oninput="maskPhone(this)">
       <textarea id="fAddr" rows="2" placeholder="Manzil (shahar, tuman, ko'cha)" maxlength="200"></textarea>
     </div>
     <button class="btn" id="sendBtn" onclick="sendOrder()">Buyurtma berish</button>`;
}
function keepForm(fn){
  const ids = ["fName","fPhone","fAddr"];
  const v = ids.map(id => $(id) ? $(id).value : "");
  fn();
  if (!cart.length){ closeAll(); return; }
  renderCart();
  ids.forEach((id,k) => { if ($(id)) $(id).value = v[k]; });
}
function chg(x,d){
  keepForm(() => {
    cart[x].qty = Math.min(99, cart[x].qty + d);
    if (cart[x].qty <= 0) cart.splice(x,1);
    updateBar();
  });
}
function rm(x){
  keepForm(() => { cart.splice(x,1); updateBar(); });
}

/* ---------- Telefon ---------- */
function maskPhone(el){
  let d = el.value.replace(/\D/g, "");
  if (d.startsWith("998")) d = d.slice(3);
  else if (el.value.startsWith("+") && d.length <= 2) d = "";
  d = d.slice(0, 9);
  let o = "+998 ";
  if (d.length) o += d.slice(0,2);
  if (d.length > 2) o += " " + d.slice(2,5);
  if (d.length > 5) o += " " + d.slice(5,7);
  if (d.length > 7) o += " " + d.slice(7,9);
  el.value = o;
}
function normPhone(s){
  let d = String(s).replace(/\D/g, "");
  if (d.length === 9) d = "998" + d;
  return /^998\d{9}$/.test(d) ? "+" + d : "";
}

/* ---------- Buyurtma yuborish ---------- */
async function sendOrder(){
  const name = $("fName").value.trim(), addr = $("fAddr").value.trim();
  const phone = normPhone($("fPhone").value);
  if (name.length < 2){ toast("Ismingizni kiriting"); return; }
  if (!phone){ toast("Telefon raqam to'liq emas"); return; }
  if (addr.length < 5){ toast("Manzilni to'liq kiriting"); return; }

  const btn = $("sendBtn");
  btn.disabled = true; btn.textContent = "Yuborilmoqda...";
  let msg = "Xatolik, qayta urinib ko'ring", status = 0;
  try{
    const r = await fetch("/api/order", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        cart: cart.map(i => ({id:i.pid, qty:i.qty, size:i.size, color:i.color})),
        name: name,
        phone: phone,
        address: addr,
        init_data: (tg && tg.initData) || ""
      })
    });
    status = r.status;
    const d = await r.json().catch(() => ({}));
    if (!r.ok || d.status !== "success"){ msg = d.message || msg; throw new Error(); }
    try { tg.HapticFeedback.notificationOccurred("success"); } catch(e){}
    cart = []; updateBar(); closeAll();
    toast("Buyurtma #" + d.order_id + " qabul qilindi! ✅");
    setTimeout(() => { if (tg) tg.close(); }, 1800);
  }catch(e){
    btn.disabled = false; btn.textContent = "Buyurtma berish";
    toast(msg);
    if (status === 409){ closeAll(); init(); }
  }
}

function closeAll(){
  $("pOv").classList.remove("show");
  $("cOv").classList.remove("show");
  document.body.classList.remove("lock");
  try { tg && tg.BackButton.hide(); } catch(e){}
}
function toast(m){
  const t = $("toast"); t.textContent = m; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 2200);
}

let _deb;
$("q").addEventListener("input", () => { clearTimeout(_deb); _deb = setTimeout(() => renderGrid(), 250); });
init();
</script>
</body>
</html>
